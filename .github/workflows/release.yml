name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version differ' }
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Search-Your-Gits-windows-x64
          if-no-files-found: error
          path: |
            release/*/Search-Your-Gits-Setup-*.exe
            release/*/Search-Your-Gits-Source-*.zip
            release/*/SHA256SUMS.txt
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = "docs/releases/v$version.md"
          if (!(Test-Path $notes)) { throw 'Missing release notes' }
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "Search Your Gits $version" --notes-file $notes "release/$version/Search-Your-Gits-Setup-$version-x64.exe" "release/$version/Search-Your-Gits-Source-$version.zip" "release/$version/SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
